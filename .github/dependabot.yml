version: 2
updates:
  # Pinned GitHub Actions (keeps the SHA pins current).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Frontend npm dependencies.
  - package-ecosystem: npm
    directory: "/v2/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Python requirement locks (root + v2 runtime/test locks).
  - package-ecosystem: pip
    directories: ["/", "/v2"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Container base images (Dockerfiles live under /docker).
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
