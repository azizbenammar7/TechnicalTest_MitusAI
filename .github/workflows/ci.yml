# Pull-request CI: backend unit + contract tests, split-plane integration on
# ephemeral PostgreSQL + Azurite, frontend typecheck/lint/test/build, and
# Terraform static validation. No Azure, no id-token, no secrets — safe for
# fork PRs. Supersedes the retired v1-characterization / v2-contract workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/p5-devsecops-cicd"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPYCACHEPREFIX: /tmp/footballai-pycache

jobs:
  backend-unit:
    name: Backend unit + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test + runtime dependencies
        # The full suite constructs the PostgreSQL and Azure backends (lazy
        # imports in composition.py), so their locks are required to run it.
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-test.txt \
            -r v2/requirements-postgres.txt \
            -r v2/requirements-azure.txt
      - name: Install ffmpeg (ffprobe drives the video_probe readiness check)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Validate Python syntax
        run: python -m compileall -q v2/src v2/tests tests pipeline scripts dashboard
      - name: Reject tracked model weights and uploaded videos
        run: ./v2/dev/check_no_tracked_models.sh
      - name: V1 characterization + V2 contract/unit tests
        run: PYTHONPATH=v2/src python -m pytest -q -ra
      - name: Reject whitespace and generated-file drift
        run: git diff --check

  backend-integration:
    name: Split-plane integration (PostgreSQL + Azurite)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: footballai
          POSTGRES_PASSWORD: devonly_ci
          POSTGRES_DB: footballai_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U footballai"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      FOOTBALLAI_TEST_DATABASE_URL: postgresql+psycopg://footballai:devonly_ci@localhost:5432/footballai_ci
      # Microsoft's public well-known Azurite emulator account key — NOT a secret
      # (allowlisted in .gitleaks.toml).
      FOOTBALLAI_TEST_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ffmpeg + Python runtime/test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check \
            -r requirements-test.txt \
            -r v2/requirements-postgres.txt \
            -r v2/requirements-azure.txt
      - name: Start Azurite (Blob) with API-version check skipped
        # A GitHub `services:` block cannot override the container command, and
        # the newer azure-storage-blob SDK needs --skipApiVersionCheck (mirrors
        # compose.p2.yaml), so run it manually.
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.33.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for i in $(seq 1 20); do
            # Azurite answers 400 to an unauthenticated GET; a completed
            # connection (curl exit 0, no -f) means it is listening.
            curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1 && break || sleep 1
          done
      - name: Apply Alembic migrations to ephemeral PostgreSQL
        run: |
          cd v2 && FOOTBALLAI_DATABASE_URL="$FOOTBALLAI_TEST_DATABASE_URL" \
            PYTHONPATH=src python -m alembic upgrade head
      - name: Run split-plane integration + contract suites
        run: PYTHONPATH=v2/src python -m pytest v2/tests -q -ra

  frontend:
    name: Frontend typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: v2/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/dashboard/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, unit-test, and build
        run: npm run check

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: fmt (all roots)
        run: terraform fmt -check -recursive infra/terraform
      - name: init + validate (no backend, no Azure)
        run: |
          for root in \
            infra/terraform/environments/staging \
            infra/terraform/bootstrap/state \
            infra/terraform/bootstrap/github-oidc; do
            echo "::group::validate $root"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done
