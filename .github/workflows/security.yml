# DevSecOps gates: secret scanning, SAST, dependency audits, and IaC scanning.
# No Azure, no id-token, no secrets — safe for fork PRs. Each gate fails the
# build on real findings; documented exceptions live in .gitleaks.toml,
# .trivyignore, and inline `# nosemgrep` justifications (never blanket ignores).
name: Security

on:
  pull_request:
  push:
    branches: [main, "feat/p5-devsecops-cicd"]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC (catches newly-published advisories)

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so historical secrets are caught
      - name: Install Gitleaks (pinned)
        run: |
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan full git history
        run: "$RUNNER_TEMP/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 ."

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan Python + TypeScript source
        run: |
          semgrep scan --error --metrics off \
            --config p/python --config p/typescript --config p/security-audit \
            v2/src pipeline scripts dashboard v2/dashboard/src

  python-deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit runtime dependency locks (fail on any known vulnerability)
        # Covers the security-sensitive API + worker runtime (PostgreSQL/Azure).
        # The v1-compat ML lock (torch) is audited out-of-band, not gated here.
        run: |
          pip-audit --progress-spinner off \
            -r v2/requirements-api.txt \
            -r v2/requirements-postgres.txt \
            -r v2/requirements-azure.txt \
            -r v2/requirements-worker-core.txt

  npm-deps:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: v2/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/dashboard/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fail on HIGH or CRITICAL advisories
        run: npm audit --audit-level=high

  trivy-iac:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Terraform for HIGH/CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
