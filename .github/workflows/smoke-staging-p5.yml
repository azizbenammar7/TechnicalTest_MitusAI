# TEMPORARY P5 VALIDATION ONLY.
# Read-only proof for the shared post-deploy smoke. Remove after it passes.
name: TEMPORARY P5 staging smoke only

on:
  push:
    branches: ["feat/p5-devsecops-cicd"]
    paths: [".github/smoke-validation/request"]

permissions:
  contents: read

concurrency:
  group: footballai-staging-smoke-validation
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke only (no Azure mutations)
    runs-on: ubuntu-latest
    environment: staging-plan # Existing Reader/OIDC plan identity.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login via OIDC (read-only plan identity)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stable-FQDN frontend and API smoke
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: bash scripts/ci/smoke-staging.sh
