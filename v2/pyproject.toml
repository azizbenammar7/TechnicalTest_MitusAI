[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footballai-v2"
version = "0.1.0"
description = "Professional V2 platform for FootballAi"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "fastapi==0.140.0",
  "httpx2==2.9.1",
  "jsonschema==4.25.1",
  "pytest==8.4.1",
  "python-multipart==0.0.22",
  # P2 cloud-adapter test dependencies (integration tests skip without emulators).
  "SQLAlchemy==2.0.52",
  "psycopg==3.3.4",
  "alembic==1.19.1",
  "azure-storage-blob==12.30.0",
  "azure-servicebus==7.14.3",
  "azure-identity==1.25.3",
]
api = [
  "fastapi==0.140.0",
  "uvicorn==0.51.0",
  "python-multipart==0.0.22",
]
# P2 control plane (PostgreSQL). See requirements-postgres.txt for the pinned lock.
postgres = [
  "SQLAlchemy==2.0.52",
  "psycopg==3.3.4",
  "alembic==1.19.1",
]
# P2 cloud data plane + queue (Azure). See requirements-azure.txt for the lock.
cloud = [
  "azure-storage-blob==12.30.0",
  "azure-servicebus==7.14.3",
  "azure-identity==1.25.3",
]
observability = [
  "azure-monitor-opentelemetry==1.8.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
